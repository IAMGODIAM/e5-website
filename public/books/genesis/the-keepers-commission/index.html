<script>
(async function(){
  try{
    var b64=document.getElementById('__payload').textContent.trim();
    var bin=atob(b64), len=bin.length, bytes=new Uint8Array(len);
    for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
    var html;
    if('DecompressionStream' in window){
      var ds=new DecompressionStream('gzip');
      var stream=new Response(new Blob([bytes]).stream().pipeThrough(ds));
      html=await stream.text();
    } else { throw new Error('no DecompressionStream'); }
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('__splash').innerHTML='<div class="sub" style="color:#e0998c">Unpack failed: '+e.message+'</div>';
  }
})();
</script></body></html>
